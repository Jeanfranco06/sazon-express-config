info:
  app:
    name: "Sazón Express"
    description: "Sistema gastronómico con microservicios y Spring Cloud Config"
    version: "1.0.0"
    author: "Sazón Express Team"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,refresh"
  endpoint:
    health:
      show-details: always
